name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Backend aşama testlerini çalıştır
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK lisanslarını kabul et ve gerekli paketleri kur
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | sort -V | tail -n1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle wrapper oluştur
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Android testlerini çalıştır ve Debug APK derle
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: APK'yı Actions çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: fpro-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
